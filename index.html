<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #1f2937;
}

header {
    background: #1f2937;
    color: white;
    padding: 24px 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #d1d5db;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 20px;
}

.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.category {
    border: 1px solid #d1d5db;
    background: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.category:hover {
    background: #e5e7eb;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
}

.product-image {
    height: 220px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6b7280;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 10px;;
}

.product-info {
    padding: 15px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.reference {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
}

.available {
    background: #dcfce7;
    color: #166534;
}

.order {
    background: #fef3c7;
    color: #92400e;
}

footer {
    text-align: center;
    color: #6b7280;
    padding: 40px 20px;
}
</style>

let categorieActuelle = "Tous";

function afficherProduits() {

    const recherche = document
        .getElementById("search")
        .value
        .toLowerCase();

    const zone = document.getElementById("products");

    const resultats = produits.filter(produit => {

        const correspondCategorie =
            categorieActuelle === "Tous" ||
            produit.categorie === categorieActuelle;

        const correspondRecherche =
            produit.nom.toLowerCase().includes(recherche) ||
            produit.reference.toLowerCase().includes(recherche);

        return correspondCategorie && correspondRecherche;
    });

    zone.innerHTML = "";

    resultats.forEach(produit => {

        const classe =
            produit.disponibilite === "Disponible en magasin"
            ? "available"
            : "order";

        zone.innerHTML += `
            <div class="product">

                <div class="product-image">
                    ${produit.image
        ? `<img src="${produit.image}" alt="${produit.nom}">`
        : "PHOTO PRODUIT"}
                </div>

                <div class="product-info">

                    <div class="product-name">
                        ${produit.nom}
                    </div>

                    <div class="reference">
                         Référence : ${produit.reference}<br>
    Marque : ${produit.marque || "Non renseignée"}
                    </div>

                    <span class="status ${classe}">
                        ${produit.disponibilite}
                    </span>

                </div>

            </div>
        `;
    });
}

function filterProducts(categorie) {
    categorieActuelle = categorie;
    afficherProduits();
}

document
    .getElementById("search")
    .addEventListener("input", afficherProduits);

afficherProduits();
