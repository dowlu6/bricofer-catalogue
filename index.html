let categorieActuelle = "Tous";

function afficherProduits() {

    const recherche = document
        .getElementById("search")
        .value
        .toLowerCase();

    const zone = document.getElementById("products");

    const resultats = produits.filter(produit => {

        const correspondCategorie =
            categorieActuelle === "Tous" ||
            produit.categorie === categorieActuelle;

        const correspondRecherche =
            produit.nom.toLowerCase().includes(recherche) ||
            produit.reference.toLowerCase().includes(recherche);

        return correspondCategorie && correspondRecherche;
    });

    zone.innerHTML = "";

    resultats.forEach(produit => {

        const classe =
            produit.disponibilite === "Disponible en magasin"
            ? "available"
            : "order";

        zone.innerHTML += `
            <div class="product" onclick="ouvrirFicheProduit('${produit.reference}')" style="cursor:pointer;">

                <div class="product-image">
                    ${produit.image
        ? `<img src="${produit.image}" alt="${produit.nom}">`
        : "PHOTO PRODUIT"}
                </div>

                <div class="product-info">

                    <div class="product-name">
                        ${produit.nom}
                    </div>

                    <div class="reference">
                         Référence : ${produit.reference}<br>
    Marque : ${produit.marque || "Non renseignée"}
                    </div>

                    <span class="status ${classe}">
                        ${produit.disponibilite}
                    </span>

                </div>

            </div>
        `;
    });
}

function filterProducts(categorie) {
    categorieActuelle = categorie;
    afficherProduits();
}

document
    .getElementById("search")
    .addEventListener("input", afficherProduits);

afficherProduits();
    function ouvrirFicheProduit(reference) {
    const produit = produits.find(p => p.reference === reference);

    if (!produit) return;

    document.getElementById("products").innerHTML = `
        <button onclick="afficherProduits()" style="margin-bottom:14px; padding:7px 11px; border:0; border-radius:6px; background:#1f2937; color:white; font-size:13px; cursor:pointer;">
            ← Retour au catalogue
        </button>

        <div class="product" style="display:block; padding:20px;">
            ${produit.image
                ? `<img src="${produit.image}" alt="${produit.nom}" style="width:100%; max-height:350px; object-fit:contain;">`
                : ""}

            <h2>${produit.nom}</h2>

            <p><strong>Référence :</strong> ${produit.reference}</p>
            <p><strong>Marque :</strong> ${produit.marque || "Non renseignée"}</p>
            <p><strong>Catégorie :</strong> ${produit.categorie}</p>
            <p><strong>Disponibilité :</strong> ${produit.disponibilite}</p>

            <h3>Description du produit</h3>
            <p>${produit.description || "Description à compléter."}</p>
        </div>
    `;
}
    afficherProduits();
